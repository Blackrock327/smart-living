<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1115 1285" role="img" aria-labelledby="title desc">
  <title id="title">แปลนบ้านแบบวาดเวกเตอร์ อ้างอิงรายละเอียดจาก PDF</title>
  <desc id="desc">แปลนบ้านชั้นเดียว มีครัว ห้องนอนสามห้อง ห้องน้ำสองห้อง โถงนั่งเล่น ระเบียง และเครื่องทำน้ำอุ่นสองเครื่อง เลือกห้องเพื่อดูอุปกรณ์จำลอง</desc>
  <defs>
    <pattern id="wallHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#7c827d" stroke-width="1"/></pattern>
    <style>
      .axis{fill:none;stroke:#929892;stroke-width:1;stroke-dasharray:9 7}
      .dim{fill:none;stroke:#5b625c;stroke-width:1.15}
      .dim-text{font:15px Arial,Tahoma,sans-serif;fill:#343a35;text-anchor:middle}
      .axis-text{font:13px Arial,sans-serif;fill:#303631;text-anchor:middle;dominant-baseline:middle}
      .axis-circle{fill:#fff;stroke:#303631;stroke-width:1.5}
      .wall{fill:none;stroke:#242a25;stroke-width:6;stroke-linejoin:miter;stroke-linecap:square}
      .inner-wall{fill:none;stroke:#303631;stroke-width:4.5;stroke-linecap:square;stroke-linejoin:miter}
      .thin{fill:none;stroke:#515952;stroke-width:1.25}
      .fine{fill:none;stroke:#7e857f;stroke-width:.9}
      .column{fill:#fff;stroke:#272d28;stroke-width:2.2}
      .column-core{fill:#303631}
      .room-label{font:12px Tahoma,Arial,sans-serif;fill:#3c433d;text-anchor:middle}
      .room-level{font:9px Arial,sans-serif;fill:#5d655e;text-anchor:middle}
      .number-tag{fill:#fff;stroke:#303631;stroke-width:1.1}
      .number-text{font:10px Arial,sans-serif;fill:#303631;text-anchor:middle;dominant-baseline:middle}
      .fixture{fill:#fff;stroke:#424943;stroke-width:1.5}
      .furniture{fill:#fafbf9;stroke:#555d56;stroke-width:1.35}
      .bed-fill{fill:#ead8b6;stroke:#383e39;stroke-width:2}
      .bed-line{fill:none;stroke:#8b806b;stroke-width:1.3}
      .zone{fill:#e9eee9;fill-opacity:.22;stroke:transparent;stroke-width:4;transition:fill-opacity .18s,stroke .18s;cursor:pointer}
      .room:hover .zone,.room:focus .zone{fill:#7eaa86;fill-opacity:.2;stroke:#6a9270;stroke-dasharray:8 5}
      .room.selected .zone{fill:#74a77c;fill-opacity:.28;stroke:#3c7549;stroke-width:5}
      .room:focus{outline:none}
      .door{fill:none;stroke:#535a54;stroke-width:1.25}
      .window{fill:#fff;stroke:#333a34;stroke-width:1.3}
      .window-line{stroke:#626a63;stroke-width:1}
      .symbol{fill:#fff;stroke:#303631;stroke-width:1.25}
      .symbol-text{font:9px Arial,sans-serif;fill:#343a35;text-anchor:middle;dominant-baseline:middle}
      .device-state-marker{pointer-events:none}
      .state-marker-background{fill:#173522;stroke:#55a96e;stroke-width:1}
      .state-marker-dot{fill:#75e69a}
      .state-marker-text{font:700 8px Arial,sans-serif;fill:#eaffef;dominant-baseline:middle}
      .device-state-marker.all-off .state-marker-background{fill:#28322b;stroke:#647168}
      .device-state-marker.all-off .state-marker-dot{fill:#89978e}
      .device-state-marker.all-off .state-marker-text{fill:#d3ddd5}
    </style>
    <g id="column"><rect class="column" x="-9" y="-9" width="18" height="18"/><rect class="column-core" x="-4" y="-4" width="8" height="8"/></g>
